<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">

  <title>Frontend Mentor | Browser extensions manager UI</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 0.6875rem;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }
  </style>
</head>

<body>
  <!-- start heder -->

  <header>
    <div class="container">
      <div class="header-container">
        <a class="logo"><img src="assets/images/logo.svg" alt="logo" /><span>Extensions</span></a>
        <button>
          <img src="assets/images/icon-sun.svg" alt="sun/light-mood" id="light" />
          <img src="assets/images/icon-moon.svg" alt="smoon/dark-mood" id="dark" />
        </button>
      </div>
    </div>
  </header>

  <!-- section -->

  <section>
    <div class="container">

      <div class="top-section">
        <h2>Extensions List</h2>
        <ul>
          <li><button data-id='all' class="active ">All</button></li>
          <li><button data-id='Active'>Active</button></li>
          <li><button data-id=' Inactive'>Inactive</button></li>
        </ul>
      </div>

      <!-- ---------------------------------- -->

      <div class="cards-con">

      </div>

    </div>
  </section>

  <!-- footer -->

  <footer class="attribution">
    Challenge by <a target="_blank" href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="https://github.com/zaheralokk3-gif" target="_blank">Eng Zaher</a>.
  </footer>

  <script src="main.js"></script>
</body>

</html>
